<script>
// Mobile nav dropdown toggle
if (document.querySelector('.nav-dropdown-toggle')) {
  document.querySelector('.nav-dropdown-toggle').addEventListener('click', function(e) {
    e.preventDefault();
    var dropdown = this.closest('.nav-dropdown');
    var isOpen = dropdown.classList.toggle('open');
    this.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  // Close dropdown when clicking outside
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.nav-dropdown')) {
      document.querySelectorAll('.nav-dropdown.open').forEach(function(d) {
        d.classList.remove('open');
        d.querySelector('.nav-dropdown-toggle').setAttribute('aria-expanded', 'false');
      });
    }
  });
  // Close mobile nav on link click
  document.querySelectorAll('.nav-dropdown-link, .top-nav > .nav-link').forEach(function(link) {
    link.addEventListener('click', function() {
      document.querySelector('.top-nav').classList.remove('open');
      document.querySelector('.nav-hamburger').setAttribute('aria-expanded', 'false');
    });
  });
}
// Highlight active nav item
(function() {
  var path = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('.nav-dropdown-link, .top-nav > .nav-link').forEach(function(link) {
    var href = link.getAttribute('href');
    if (!href) return;
    var linkPath = new URL(href, window.location.origin).pathname.replace(/\/$/, '') || '/';
    if (linkPath === path) {
      link.classList.add('active');
    }
  });
})();
</script>
